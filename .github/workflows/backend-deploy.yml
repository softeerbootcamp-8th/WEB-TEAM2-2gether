name: Backend CI and Deploy

on:
  push:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/web-team2-2gether/backend

jobs:
  test:
    name: Gradle test
    runs-on: ubuntu-24.04-arm
    outputs:
      failed_tests: ${{ steps.test-summary.outputs.failed_tests }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: dbidding
          MYSQL_USER: dbidding
          MYSQL_PASSWORD: dbidding
          MYSQL_ROOT_PASSWORD: dbidding-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pdbidding-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Initialize MySQL schema
        run: |
          docker exec -i "${{ job.services.mysql.id }}" \
            mysql -udbidding -pdbidding dbidding < backend/src/main/resources/schema.sql

      - name: Run Gradle tests
        working-directory: backend
        run: ./gradlew test --no-daemon

      - name: Collect failed test summary
        if: always()
        id: test-summary
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob
          import xml.etree.ElementTree as element_tree

          failed_tests = []
          for path in glob.glob("backend/build/test-results/test/*.xml"):
              root = element_tree.parse(path).getroot()
              for testcase in root.findall("testcase"):
                  if testcase.find("failure") is not None or testcase.find("error") is not None:
                      failed_tests.append(f"{testcase.get('classname')}.{testcase.get('name')}")

          print("failed_tests<<EOF")
          print("\\n".join(failed_tests[:5]) or "없음")
          print("EOF")
          PY

  build-dev:
    name: Build development image
    if: github.ref_name == 'dev'
    needs: test
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image without pushing
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-prod-image:
    name: Build and publish production image
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-prod:
    name: Deploy production image
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: publish-prod-image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy image digest on EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
            DIGEST="${{ needs.publish-prod-image.outputs.digest }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "${IMAGE}@${DIGEST}"
            docker tag "${IMAGE}@${DIGEST}" "${IMAGE}:latest"
            cd ~
            docker compose up -d --no-deps --force-recreate backend
            docker image prune -f

  notify:
    name: Notify Slack
    if: always() && needs.test.result != 'skipped'
    needs: [test, build-dev, publish-prod-image, deploy-prod]
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send workflow result to Slack
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          TEST_RESULT: ${{ needs.test.result }}
          DEV_BUILD_RESULT: ${{ needs.build-dev.result }}
          IMAGE_RESULT: ${{ needs.publish-prod-image.result }}
          DEPLOY_RESULT: ${{ needs.deploy-prod.result }}
          IMAGE_DIGEST: ${{ needs.publish-prod-image.outputs.digest }}
          FAILED_TESTS: ${{ needs.test.outputs.failed_tests }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          status_label() {
            case "$1" in
              success) echo "성공" ;;
              failure) echo "실패" ;;
              skipped) echo "수행 안 함" ;;
              cancelled) echo "취소됨" ;;
              *) echo "$1" ;;
            esac
          }

          CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" | head -n 5 | awk 'BEGIN { ORS="" } { printf "%s%s", (NR == 1 ? "" : ", "), $0 }')
          CHANGED_FILES=${CHANGED_FILES:-없음}
          DEV_BUILD_LABEL=$(status_label "$DEV_BUILD_RESULT")
          IMAGE_LABEL=$(status_label "$IMAGE_RESULT")
          DEPLOY_LABEL=$(status_label "$DEPLOY_RESULT")

          if [[ "${{ github.ref_name }}" == "dev" ]]; then
            ENVIRONMENT="개발"
            IMAGE_RESULT="빌드 ${DEV_BUILD_LABEL}, Registry 미등록"
            DEPLOY_RESULT="수행 안 함"
          else
            ENVIRONMENT="운영"
            IMAGE_RESULT="$IMAGE_LABEL"
            DEPLOY_RESULT="$DEPLOY_LABEL"
          fi

          RESULT="성공"
          if [[ "$TEST_RESULT" != "success" || ( "$ENVIRONMENT" == "개발" && "$DEV_BUILD_RESULT" != "success" ) || ( "$ENVIRONMENT" == "운영" && ( "$IMAGE_RESULT" != "success" || "$DEPLOY_RESULT" != "success" ) ) ]]; then
            RESULT="실패"
          fi

          if [[ "$TEST_RESULT" == "success" ]]; then
            TEST_SUMMARY="성공"
          else
            TEST_SUMMARY="실패\n실패 테스트:\n${FAILED_TESTS:-없음}"
          fi

          printf -v MESSAGE '[%s] 백엔드 %s 환경 CI\n\n실행자: %s\n브랜치: %s\n커밋: %.7s\n변경 파일: %s\n테스트: %b\n이미지: %s\nDigest: %s\n배포: %s\n실행 로그: %s' \
            "$RESULT" "$ENVIRONMENT" "$ACTOR" "${{ github.ref_name }}" "${CURRENT_SHA}" "$CHANGED_FILES" \
            "$TEST_SUMMARY" "$IMAGE_RESULT" "${IMAGE_DIGEST:-미등록}" "$DEPLOY_RESULT" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          jq -n \
            --arg text "$MESSAGE" \
            '{text: $text}' | \
            curl --fail-with-body --show-error --silent \
              -X POST -H 'Content-type: application/json' \
              --data @- "$SLACK_WEBHOOK_URL"
