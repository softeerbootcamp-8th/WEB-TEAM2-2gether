spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dbidding}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:dbidding}
    password: ${DB_PASSWORD:dbidding}

  jpa:
    hibernate:
      ddl-auto: validate

  sql:
    init:
      mode: never

  test:
    database:
      replace: none

cloud:
  aws:
    region: ap-northeast-2
    s3:
      bucket: test-only-bucket
      presign-duration-seconds: 300

app:
  jwt:
    # 공개 가능한 테스트 전용 값이다. 운영 비밀키로 사용하지 않는다.
    secret: test-only-jwt-secret-at-least-32-bytes
    access-token-seconds: ${JWT_ACCESS_SECONDS:1800}
    refresh-token-seconds: ${JWT_REFRESH_SECONDS:604800}
    secure-cookie: ${JWT_SECURE_COOKIE:false}
