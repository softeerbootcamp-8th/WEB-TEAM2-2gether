spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dbidding}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:dbidding}
    password: ${DB_PASSWORD:dbidding}

  jpa:
    hibernate:
      ddl-auto: validate

  sql:
    init:
      mode: never

  test:
    database:
      replace: none

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-seconds: ${JWT_ACCESS_SECONDS:1800}
    refresh-token-seconds: ${JWT_REFRESH_SECONDS:604800}
    secure-cookie: ${JWT_SECURE_COOKIE:false}
