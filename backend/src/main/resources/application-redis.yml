spring:
  data:
    redis:
      # XREADGROUP BLOCK(기본 1초)보다 길어야 빈 Stream 대기가 command timeout으로 실패하지 않는다.
      timeout: ${AUCTION_REDIS_COMMAND_TIMEOUT:2s}
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: ${AUCTION_REDIS_BID_JDBC_BATCH_SIZE:100}
        order_inserts: true
        order_updates: true

app:
  auction:
    redis-bid:
      block: ${AUCTION_REDIS_BID_BLOCK:1s}
      claim-idle: ${AUCTION_REDIS_BID_CLAIM_IDLE:30s}
      # DLQ 재시도에는 더 이상 사용하지 않지만 기존 프로필 설정과의 호환성을 유지한다.
      max-retries: ${AUCTION_REDIS_BID_MAX_RETRIES:3}
      # 단일 timeline queue는 leader lock을 획득한 하나의 Consumer만 순차 처리한다.
      consumer-lock-at-most-for: ${AUCTION_REDIS_BID_CONSUMER_LOCK_AT_MOST_FOR:5m}
      # 한 번의 blocking read 후 단건씩 처리할 최대 이벤트 수. 각 이벤트는 별도 DB 트랜잭션과 ACK를 사용한다.
      # inbox에 결과가 기록된 Stream 레코드는 ACK와 XDEL로 즉시 제거한다.
      max-records-per-run: ${AUCTION_REDIS_BID_MAX_RECORDS_PER_RUN:100}

auction:
  catchup-verification:
    # 여러 엔티티가 동시에 콜드미스 나도 전역 캐치업 여부는 이 주기로만 재확인한다.
    cache-ttl: ${AUCTION_CATCHUP_CACHE_TTL:PT0.5S}
  active-index:
    cleanup:
      fixed-delay-ms: ${AUCTION_ACTIVE_INDEX_CLEANUP_FIXED_DELAY_MS:3600000}
      stale-after: ${AUCTION_ACTIVE_INDEX_CLEANUP_STALE_AFTER:PT24H}
      batch-size: ${AUCTION_ACTIVE_INDEX_CLEANUP_BATCH_SIZE:100}
  state-seeding:
    warm-up:
      enabled: ${AUCTION_STATE_WARM_UP_ENABLED:true}
      closing-window-minutes: ${AUCTION_STATE_WARM_UP_CLOSING_WINDOW_MINUTES:30}
      recent-limit: ${AUCTION_STATE_WARM_UP_RECENT_LIMIT:100}
    wallet-cold-batch:
      # 서로 다른 userId의 동시 콜드시드를 이 시간(ms) 동안 모아 배치 쿼리 1회로 묶는다.
      # 경합이 없는 단독 요청도 이 시간만큼은 기다리게 되는 지연 하한선이다.
      window-ms: ${WALLET_COLD_SEED_BATCH_WINDOW_MS:5}
      # 윈도우가 끝나기 전이라도 이 크기에 도달하면 즉시 flush한다.
      max-batch-size: ${WALLET_COLD_SEED_MAX_BATCH_SIZE:200}
    wallet-warm-up:
      # 기동 시 현재 자금이 묶여있는(HELD) 지갑만 제한적으로 미리 Redis에 올려,
      # 재기동 직후 첫 요청에서 콜드시드가 몰리는 것을 줄인다. 신규 유저 버스트는
      # 이 warm-up 대상이 아니므로 wallet-cold-batch가 그 몫을 담당한다.
      enabled: ${WALLET_STATE_WARM_UP_ENABLED:true}
      recent-limit: ${WALLET_STATE_WARM_UP_RECENT_LIMIT:200}
