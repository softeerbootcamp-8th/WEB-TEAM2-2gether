spring:
  data:
    redis:
      # XREADGROUP BLOCK(기본 1초)보다 길어야 빈 Stream 대기가 command timeout으로 실패하지 않는다.
      timeout: ${AUCTION_REDIS_COMMAND_TIMEOUT:2s}
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: ${AUCTION_REDIS_BID_JDBC_BATCH_SIZE:100}
        order_inserts: true
        order_updates: true

app:
  auction:
    redis-bid:
      batch-size: ${AUCTION_REDIS_BID_BATCH_SIZE:100}
      block: ${AUCTION_REDIS_BID_BLOCK:1s}
      claim-idle: ${AUCTION_REDIS_BID_CLAIM_IDLE:30s}
      max-retries: ${AUCTION_REDIS_BID_MAX_RETRIES:3}
      poll-delay: ${AUCTION_REDIS_BID_POLL_DELAY:100ms}
